name: Deploy GitHub Pages on Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to deploy"
        required: true
        default: "main"
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.txt"
      - "*.xml"
      - "data/*.json"
      - "data/**"
      - "assets/**"
      - "media/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "feedback-worker/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-pages-on-release.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.sha }}
      upload_pages: true

  deploy:
    needs: gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
