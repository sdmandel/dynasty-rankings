name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      upload_pages:
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Run tests
        run: python -m pytest tests/ -x -q

      - name: Validate JSON data files
        run: python scripts/validate_json.py
      - name: Test feedback without external requests
        run: node --test feedback-worker/worker.test.mjs
      - name: Setup Pages
        if: inputs.upload_pages
        uses: actions/configure-pages@v6
      - name: Upload the exact tested checkout
        if: inputs.upload_pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
